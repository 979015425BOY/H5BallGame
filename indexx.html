<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小球碰撞对战游戏</title>
    <style>
        canvas {
            border: 1px solid black;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.18.0/matter.min.js"></script>
</head>

<body>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <script>
        // 初始化 Matter.js 模块
        const { Engine, Render, World, Bodies, Runner, Events } = Matter;

        // 创建引擎，关闭重力
        const engine = Engine.create({
            gravity: {
                x: 0,
                y: 0
            }
        });

        // 创建渲染器
        const render = Render.create({
            element: document.body,
            engine: engine,
            canvas: document.getElementById('gameCanvas'),
            options: {
                width: 800,
                height: 600,
                wireframes: false
            }
        });

        // 定义小球的最小速度
        const minBallSpeed = 6;
        // 定义小球的最大速度
        const maxBallSpeed = 10;

        // 生成随机方向和速度的向量
        function getRandomDirection() {
            const randomAngle = Math.random() * 2 * Math.PI;
            const randomSpeed = Math.random() * (maxBallSpeed - minBallSpeed) + minBallSpeed;
            return {
                x: Math.cos(randomAngle) * randomSpeed,
                y: Math.sin(randomAngle) * randomSpeed
            };
        }

        // 创建小球
        const ball1 = Bodies.circle(100, 100, 20, {
            frictionAir: 0,
            restitution: 1
        });
        const ball2 = Bodies.circle(700, 500, 20, {
            frictionAir: 0,
            restitution: 1
        });

        // 为小球设置随机初始速度
        Matter.Body.setVelocity(ball1, getRandomDirection());
        Matter.Body.setVelocity(ball2, getRandomDirection());

        // 创建边界
        const ground = Bodies.rectangle(400, 600, 800, 50, { isStatic: true });
        const ceiling = Bodies.rectangle(400, 0, 800, 50, { isStatic: true });
        const leftWall = Bodies.rectangle(0, 300, 50, 600, { isStatic: true });
        const rightWall = Bodies.rectangle(800, 300, 50, 600, { isStatic: true });

        // 将物体添加到世界
        World.add(engine.world, [ball1, ball2, ground, ceiling, leftWall, rightWall]);

        // 运行渲染器
        Render.run(render);

        // 创建运行器并运行引擎
        const runner = Runner.create();
        Runner.run(runner, engine);

        // 碰撞检测事件
        Events.on(engine, 'collisionStart', (event) => {
            const pairs = event.pairs;
            for (let i = 0; i < pairs.length; i++) {
                const pair = pairs[i];
                if ((pair.bodyA === ball1 && pair.bodyB === ball2) || (pair.bodyA === ball2 && pair.bodyB === ball1)) {
                    // 当两个小球碰撞时，可以在这里添加额外的逻辑，比如计分等
                    console.log('小球碰撞！');
                }
            }
        });
    </script>
</body>

</html>
