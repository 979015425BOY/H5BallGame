<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小球碰撞对战</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
        }

        #progress-container {
            text-align: center;
            margin-bottom: 20px;
        }

        .progress-bar {
            height: 20px;
            margin: 10px 0;
            background-color: #333;
        }

        .progress-fill {
            height: 100%;
        }

        #usa-progress .progress-fill {
            background-color: #ff0000;
        }

        #russia-progress .progress-fill {
            background-color: #0000ff;
        }

        canvas {
            border: 2px solid #ffd700;
            display: block;
            margin: 0 auto;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.18.0/matter.min.js"></script>
</head>

<body>
    <div id="progress-container">
        <div class="progress-bar" id="usa-progress">
            <div class="progress-fill" style="width: 100%;"></div>
            <span>USA</span>
        </div>
        <div class="progress-bar" id="russia-progress">
            <div class="progress-fill" style="width: 100%;"></div>
            <span>Russia</span>
        </div>
    </div>
    <canvas id="game-canvas" width="400" height="400"></canvas>
    <script>
        const { Engine, Render, World, Bodies, Events } = Matter;

        // 初始化引擎和渲染器
        const engine = Engine.create();
        const render = Render.create({
            element: document.body,
            engine: engine,
            canvas: document.getElementById('game-canvas'),
            options: {
                width: 400,
                height: 400,
                wireframes: false
            }
        });

        // 创建 USA 小球（需替换为实际国旗图片路径）
        const usaBall = Bodies.circle(100, 100, 30, {
            frictionAir: 0.01,
            restitution: 0.8,
            render: {
                sprite: {
                    texture: 'usa-flag.png' // 替换为 USA 国旗图片路径
                }
            }
        });

        // 创建 Russia 小球（需替换为实际国旗图片路径）
        const russiaBall = Bodies.circle(300, 300, 30, {
            frictionAir: 0.01,
            restitution: 0.8,
            render: {
                sprite: {
                    texture: 'russia-flag.png' // 替换为俄罗斯国旗图片路径
                }
            }
        });

        // 添加小球到世界
        World.add(engine.world, [usaBall, russiaBall]);

        // 生成随机速度方向
        function setRandomVelocity(ball) {
            const angle = Math.random() * 2 * Math.PI;
            const speed = 2;
            Matter.Body.setVelocity(ball, {
                x: Math.cos(angle) * speed,
                y: Math.sin(angle) * speed
            });
        }
        setRandomVelocity(usaBall);
        setRandomVelocity(russiaBall);

        // 碰撞事件处理
        Events.on(engine, 'collisionStart', (event) => {
            const pairs = event.pairs;
            for (const pair of pairs) {
                if ((pair.bodyA === usaBall && pair.bodyB === russiaBall) ||
                    (pair.bodyA === russiaBall && pair.bodyB === usaBall)) {
                    // 减少进度条
                    const usaProgress = document.getElementById('usa-progress').querySelector('.progress-fill');
                    const russiaProgress = document.getElementById('russia-progress').querySelector('.progress-fill');
                    const currentUsaWidth = parseFloat(usaProgress.style.width);
                    const currentRussiaWidth = parseFloat(russiaProgress.style.width);
                    if (currentUsaWidth > 10) {
                        usaProgress.style.width = `${currentUsaWidth - 10}%`;
                    }
                    if (currentRussiaWidth > 10) {
                        russiaProgress.style.width = `${currentRussiaWidth - 10}%`;
                    }
                }
            }
        });

        // 运行渲染和引擎
        Render.run(render);
        const runner = Runner.create();
        Runner.run(runner, engine);
    </script>
</body>

</html>
